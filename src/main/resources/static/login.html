<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodvie - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d0d0d; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .container { background: #1a1a2e; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; }

        .logo { text-align: center; font-size: 32px; font-weight: bold; color: #26A69A; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; font-size: 14px; }

        .tabs { display: flex; margin-bottom: 25px; border-bottom: 1px solid #333; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #aaa; font-size: 15px; }
        .tab.active { color: #26A69A; border-bottom: 2px solid #26A69A; }

        .form { display: none; }
        .form.active { display: block; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: #aaa; font-size: 13px; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #333; background: #0d0d0d; color: #fff; font-size: 15px; outline: none; }
        .input-group input:focus { border-color: #26A69A; }

        .btn { width: 100%; padding: 12px; background: #26A69A; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #1d7a70; }

        .message { text-align: center; margin-top: 15px; font-size: 14px; padding: 10px; border-radius: 8px; display: none; }
        .message.error { background: #ff444422; color: #ff4444; }
        .message.success { background: #26A69A22; color: #26A69A; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Moodvie</div>
    <div class="subtitle">Your AI Movie Recommender</div>

    <!-- Login / Register tabs -->
    <div class="tabs">
        <div class="tab active" onclick="showForm('login', this)">Login</div>
        <div class="tab" onclick="showForm('register', this)">Register</div>
    </div>

    <!-- Login form -->
    <div class="form active" id="login-form">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="login-username" placeholder="Enter your username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="Enter your password">
        </div>
        <button class="btn" onclick="login()">Login</button>
        <div class="message" id="login-message"></div>
    </div>

    <!-- Register form -->
    <div class="form" id="register-form">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="reg-username" placeholder="Choose a username">
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="reg-email" placeholder="Enter your email">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="Choose a password">
        </div>
        <button class="btn" onclick="register()">Create Account</button>
        <div class="message" id="register-message"></div>
    </div>
</div>

<script>
    // Switch between login and register
    function showForm(form, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
        el.classList.add('active');
        document.getElementById(form + '-form').classList.add('active');
    }

    // Show message to user
    function showMessage(id, text, type) {
        const msg = document.getElementById(id);
        msg.textContent = text;
        msg.className = 'message ' + type;
        msg.style.display = 'block';
    }

    // Login function
    async function login() {
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        if (!username || !password) {
            showMessage('login-message', 'Please fill all fields', 'error');
            return;
        }

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();

            if (data.success) {
                // Save username and redirect to main page
                localStorage.setItem('moodvie_user', data.username);
                window.location.href = '/index.html';
            } else {
                showMessage('login-message', data.message, 'error');
            }
        } catch(e) {
            showMessage('login-message', 'Error. Please try again.', 'error');
        }
    }

    // Register function
    async function register() {
        const username = document.getElementById('reg-username').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        if (!username || !email || !password) {
            showMessage('register-message', 'Please fill all fields', 'error');
            return;
        }

        if (password.length < 6) {
            showMessage('register-message', 'Password must be at least 6 characters', 'error');
            return;
        }

        try {
            const res = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, email, password})
            });
            const data = await res.json();

            if (data.success) {
                showMessage('register-message', 'Account created! Please login.', 'success');
                setTimeout(() => showForm('login', document.querySelectorAll('.tab')[0]), 1500);
            } else {
                showMessage('register-message', data.message, 'error');
            }
        } catch(e) {
            showMessage('register-message', 'Error. Please try again.', 'error');
        }
    }

    // Login on Enter key
    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const activeForm = document.querySelector('.form.active').id;
            if (activeForm === 'login-form') login();
            else register();
        }
    });

    // If already logged in, redirect to main page
    if (localStorage.getItem('moodvie_user')) {
        window.location.href = '/index.html';
    }
</script>

</body>
</html>
